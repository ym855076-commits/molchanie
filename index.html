<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Молчание — Искусство выдержки</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1a1d24;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --border-color: #262a33;
            --subtext-color: #9aa0a6;
        }

        body.light-theme {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --accent-color: #b8860b;
            --border-color: #e5e5e7;
            --subtext-color: #86868b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 { font-size: 24px; color: var(--accent-color); font-weight: normal; letter-spacing: 1px; }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .streak-count {
            font-size: 28px;
            color: var(--accent-color);
            font-weight: bold;
            display: inline-block;
            margin-right: 6px;
        }

        .streak-text { color: var(--subtext-color); font-size: 14px; }

        textarea {
            width: 100%;
            height: 90px;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-color);
            font-size: 14px;
            margin: 15px 0 10px 0;
            resize: none;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn:active { transform: scale(0.98); }

        .entry-item {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .entry-date { font-size: 11px; color: var(--subtext-color); }

        .checkbox-group { margin-top: 10px; }
        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-label input { margin-right: 10px; accent-color: var(--accent-color); }

        .quote-box {
            font-style: italic;
            margin-bottom: 15px;
            min-height: 50px;
        }

        .quote-author {
            display: block;
            text-align: right;
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 5px;
            font-style: normal;
        }

        .video-btn {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            background: #cc0000;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 10px;
            width: 100%;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Молчание</h1>
        <button class="theme-btn" onclick="toggleTheme()">Светлая / Тёмная</button>
    </header>

    <!-- ДНЕВНИК ВЫДЕРЖКИ -->
    <div class="card">
        <div style="margin-bottom: 10px;">
            <span class="streak-count" id="streak-num">0</span>
            <span class="streak-text">дней подряд с записью</span>
        </div>
        <textarea id="entry-input" placeholder="Опиши момент, когда промолчал вместо того, чтобы сорваться. Что ты выиграл?"></textarea>
        <button class="btn" onclick="saveEntry()">Сохранить запись</button>
        
        <div id="entries-list" style="margin-top: 15px;"></div>
        <button class="btn" onclick="downloadTxt()" style="margin-top: 10px; border-color: var(--border-color); color: var(--subtext-color);">Скачать записи (.txt)</button>
    </div>

    <!-- ГЕНЕРАТОР МУДРОСТИ -->
    <div class="card">
        <div class="quote-box">
            <p id="quote-text">«Крепче всего звучит голос, который редко повышают.»</p>
            <span class="quote-author" id="quote-author">— Стоическая мудрость</span>
        </div>
        <button class="btn" onclick="nextQuote()">Другая мысль →</button>
    </div>

    <!-- ТРИ ВОПРОСА -->
    <div class="card">
        <h3 style="font-size: 16px; font-weight: normal; margin-bottom: 12px; color: var(--accent-color);">Прежде чем сказать</h3>
        <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" class="check-q" onchange="checkThreeQuestions()"> Это правда?</label>
            <label class="checkbox-label"><input type="checkbox" class="check-q" onchange="checkThreeQuestions()"> Это нужно сказать?</label>
            <label class="checkbox-label"><input type="checkbox" class="check-q" onchange="checkThreeQuestions()"> Это можно сказать по-доброму?</label>
        </div>
    </div>

    <!-- ВИДЕО И СКАЧИВАНИЕ -->
    <div class="card">
        <h3 style="font-size: 16px; font-weight: normal; margin-bottom: 8px;">О молчании (Видео)</h3>
        <p style="font-size: 12px; color: var(--subtext-color); margin-bottom: 10px;">Смотрите напрямую или скачивайте через NewPipe / VidMate</p>
        <a class="video-btn" href="intent://www.youtube.com/watch?v=5qap5aO4i9A#Intent;package=org.schabi.newpipe;scheme=https;end">Открыть / Скачать в NewPipe ➔</a>
    </div>

    <div class="toast" id="toast">Запись сохранена!</div>

    <script>
        const quotes = [
            { text: "Крепче всего звучит голос, который редко повышают.", author: "Стоическая мудрость" },
            { text: "Лучший способ отомстить — не быть похожим на обидчика.", author: "Марк Аврелий" },
            { text: "Природа дала нам один язык и два уха, чтобы мы больше слушали и меньше говорили.", author: "Эпиктет" },
            { text: "Мы страдаем чаще воображением, чем реальностью.", author: "Сенека" },
            { text: "Молчание — щит разумного.", author: "Восточная мудрость" }
        ];

        let entries = JSON.parse(localStorage.getItem('molchanie_entries') || '[]');

        function init() {
            renderEntries();
            updateStreak();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function saveEntry() {
            const input = document.getElementById('entry-input');
            const text = input.value.trim();
            if(!text) return;

            const newEntry = {
                id: Date.now(),
                date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }),
                timestamp: Date.now(),
                text: text
            };

            entries.unshift(newEntry);
            localStorage.setItem('molchanie_entries', JSON.stringify(entries));
            input.value = '';
            renderEntries();
            updateStreak();
            showToast('Запись сохранена!');
        }

        function renderEntries() {
            const list = document.getElementById('entries-list');
            list.innerHTML = entries.map(e => `
                <div class="entry-item">
                    <div>
                        <div style="font-size: 14px;">${e.text}</div>
                        <div class="entry-date">${e.date}</div>
                    </div>
                    <span style="cursor:pointer; color:#888;" onclick="deleteEntry(${e.id})">✕</span>
                </div>
            `).join('');
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('molchanie_entries', JSON.stringify(entries));
            renderEntries();
            updateStreak();
        }

        function updateStreak() {
            if(entries.length === 0) {
                document.getElementById('streak-num').innerText = '0';
                return;
            }
            // Простой расчёт уникальных дней
            const uniqueDays = new Set(entries.map(e => e.date));
            document.getElementById('streak-num').innerText = uniqueDays.size;
        }

        function downloadTxt() {
            if(entries.length === 0) return alert('Нет записей для скачивания');
            const txt = entries.map(e => `=== ${e.date} ===\n${e.text}\n`).join('\n----------------------------------------\n\n');
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'dnevnik-vyderzhki.txt';
            a.click();
        }

        function nextQuote() {
            const q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-text').innerText = `«${q.text}»`;
            document.getElementById('quote-author').innerText = `— ${q.author}`;
        }

        function checkThreeQuestions() {
            const checkboxes = document.querySelectorAll('.check-q');
            const allChecked = Array.from(checkboxes).every(c => c.checked);
            if(allChecked) {
                showToast('Пауза взята. Ты контролируешь ситуацию!');
                setTimeout(() => checkboxes.forEach(c => c.checked = false), 1500);
            }
        }

        init();
    </script>
</body>
</html>
